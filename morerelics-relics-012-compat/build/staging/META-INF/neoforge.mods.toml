displayName="MoreRelics New Relics Fix"
authors="Gasharaujo"
description='''
Runtime compatibility bridge for More Relics 1.7.6/1.7.7 and Relics 0.12.8.
Remaps the removed legacy Relics API and translates legacy relic definitions to the current template API.
Also restores More Relics descriptions in the redesigned Relics interface.
Forwards ability activation to the original More Relics item callbacks.
'''

